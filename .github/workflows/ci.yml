name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "update/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest
        run: npm run test -- --passWithNoTests
