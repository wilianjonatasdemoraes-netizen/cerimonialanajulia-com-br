name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "update/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Supabase SDK atual requer Node.js 22 ou superior.          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security dependency audit (report)
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))},null,2))'
      - name: Production dependency audit (report)
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a=require("./npm-audit-production.json"); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))'
      - name: Build production bundle
        run: npm run build
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest
        run: npm run test -- --passWithNoTests
