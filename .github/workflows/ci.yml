name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "update/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Build, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Regenerates the lockfile so npm ci is reproducible for the declared package.json.
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile changes when needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest
        run: npm run test -- --passWithNoTests
