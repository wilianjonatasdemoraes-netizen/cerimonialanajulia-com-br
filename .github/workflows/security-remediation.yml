name: Safe dependency remediation

on:
  push:
    branches:
      - "update/ana-domain-branding-conversion"

permissions:
  contents: write

concurrency:
  group: safe-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: update/ana-domain-branding-conversion
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking security updates
        run: npm audit fix --package-lock-only || true
      - name: Install updated lockfile
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest
        run: npm run test -- --passWithNoTests
      - name: Report remaining production vulnerabilities
        run: npm audit --omit=dev || true
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply non-breaking dependency security updates"
            git push origin update/ana-domain-branding-conversion
          else
            echo "No safe lockfile updates available."
          fi
