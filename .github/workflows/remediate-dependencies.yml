name: Release dependency remediation

on:
  push:
    branches:
      - hardening/ana-release-security

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/ana-release-security
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply available dependency security fixes
        run: npm audit fix --force
      - name: Clean install
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test -- --passWithNoTests
      - name: Report remaining dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {},null,2))'
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a=require("./npm-audit-production.json"); console.log("Production:",JSON.stringify(a.metadata?.vulnerabilities ?? {},null,2))'
      - name: Commit dependency updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: remediate dependency security advisories"
            git push origin hardening/ana-release-security
          else
            echo "No dependency manifest changes were produced."
          fi
